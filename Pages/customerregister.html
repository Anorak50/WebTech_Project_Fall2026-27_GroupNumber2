
<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Design/customer.css">
    <script src="../JS/customer.js"></script>
    <title>Customer Registration</title>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>Wayfare</h2>
            <a href="login.html" class="logout">Log Out</a>
        </div>

        <h1>Customer Registration Form</h1>

        <form id="registrationForm" onsubmit="return collect_data()">

            <fieldset>
                <legend>Customer Information</legend>

                <table>
                    <tr>
                        <td><label for="customerName">Full Name:</label></td>
                        <td>
                            <input type="text" id="customerName">
                            <p id="NameError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td>
                            <input type="email" id="email">
                            <p id="EmailError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="phone">Phone Number:</label></td>
                        <td>
                            <input type="text" id="phone">
                            <p id="PhoneError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>Gender:</td>
                        <td>
                            <input type="radio" name="gender" value="Male"> Male
                            <input type="radio" name="gender" value="Female"> Female
                            <p id="ErrorGender" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="address">Address:</label></td>
                        <td>
                            <textarea id="address"></textarea>
                            <p id="AddressError" class="error"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>Account Information</legend>

                <table>
                    <tr>
                          <td><label for="username">Username:</label></td>
                          <td>
                          <input type="text" id="username">
                          <p id="UsernameError" class="error"></p>
                       </td>
                    </tr>

                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td>
                            <input type="password" id="password">
                            <p id="PasswordError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="confirmPassword">Confirm Password:</label></td>
                        <td>
                            <input type="password" id="confirmPassword">
                            <p id="ConfirmPasswordError" class="error"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <br>

            <input type="submit" id="submit" for="submit" class="btn4" value="Register">
            <input type="reset" id="reset" class="btn4" for="reset">

        </form>

        <div class="backtopage">
            <a href="admin.html" class="btn4">Back to Main Page</a>
        </div>

    </div>

    <div class="footer">
        <h4>Wayfare Customer Portal</h4>
    </div>

    

</body>
</html>


<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Design/customer.css">
    <title>Edit Profile</title>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>Wayfare</h2>
           <a href="../index.html" class="logout">Log Out</a>
        </div>

        <h1>Edit Profile</h1>

          <div class="logo">
                <img src="../customerimages/profileedit.jpg" id="logoimg">
             </div>

        <form id="editProfileForm">

            <fieldset>
                <legend>Personal Information</legend>

                <table>

                    <tr>
                        <td><label for="customerName">Full Name:</label></td>
                        <td>
                            <input type="text" id="customerName" value="Sakib Monir Hossen">
                            <p id="NameError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>Gender:</td>
                        <td>
                            <input type="radio" name="gender" value="Male" checked> Male
                            <input type="radio" name="gender" value="Female"> Female
                            <p id="ErrorGender" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td>
                            <input type="email" id="email" value="sakib@gmail.com">
                            <p id="EmailError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="phone">Phone Number:</label></td>
                        <td>
                            <input type="text" id="phone" value="017111111111">
                            <p id="PhoneError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="address">Address:</label></td>
                        <td>
                            <textarea id="address">Dhaka, Bangladesh</textarea>
                            <p id="AddressError" class="error"></p>
                        </td>
                    </tr>

                </table>

            </fieldset>

            <fieldset>
                <legend>Account Information</legend>

                <table>

                    <tr>
                        <td><label for="username">Username:</label></td>
                        <td>
                            <input type="text" id="username" value="sakib22">
                            <p id="UsernameError" class="error"></p>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td>
                            <input type="password" id="password" value="password123">
                            <p id="PasswordError" class="error"></p>
                        </td>
                    </tr>

                </table>

            </fieldset>

            <br>

            <input type="submit" id="submit" class="btn4" value="Save Changes">
            <input type="reset" id="reset" class="btn4" value="Reset">

        </form>

        <div class="backtopage">
            <a href="myprofile.html" class="btn4">Back to Profile</a>
        </div>

    </div>

    <div class="footer">
        <h4>Wayfare Customer Portal</h4>
    </div>

</body>
</html>
